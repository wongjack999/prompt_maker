<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Prompt Pro - Pure Manual Image Mode</title>
    <!-- Google Material Symbols (Outlined) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root { 
            --md-bg: #f8f9ff;
            --md-surface: #ffffff;
            --md-surface-low: #f0f4f9;
            --md-surface-high: #e1e6f0;
            --md-primary: #0b57d0;
            --md-primary-hover: #0842a0;
            --md-primary-container: #d3e3fd;
            --md-on-primary-container: #041e49;
            --md-text-main: #1f1f1f;
            --md-text-sub: #444746;
            --md-outline: #c4c7c5;
            --md-outline-variant: #e1e3e1;
            
            --radius-pill: 28px;
            --radius-card: 20px;
            --radius-sm: 12px;
            
            --elevation-1: 0px 1px 3px rgba(0, 0, 0, 0.08), 0px 1px 2px rgba(0, 0, 0, 0.06);
            --elevation-2: 0px 4px 8px rgba(0, 0, 0, 0.08);
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--md-bg); 
            margin: 0; 
            padding-bottom: 240px; 
            color: var(--md-text-main);
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }

        .material-symbols-outlined {
            font-size: 22px;
            color: var(--md-primary);
            vertical-align: middle;
        }
        
        .app-header {
            position: sticky;
            top: 0;
            background: var(--md-bg);
            padding: 12px 16px 8px 16px;
            z-index: 900;
        }
        .tabs { 
            display: flex; 
            background: var(--md-surface-low); 
            padding: 4px; 
            border-radius: var(--radius-pill); 
            border: 1px solid var(--md-outline-variant);
        }
        .tab { 
            flex: 1; 
            text-align: center; 
            padding: 12px; 
            font-weight: 700; 
            color: var(--md-text-sub); 
            border-radius: var(--radius-pill); 
            transition: all 0.2s ease; 
            font-size: 15px; 
            cursor: pointer; 
        }
        .tab.active { 
            color: var(--md-on-primary-container); 
            background: var(--md-surface); 
            box-shadow: var(--elevation-1); 
        }

        .container { padding: 0 16px; max-width: 600px; margin: 0 auto; }
        .section { display: none; }
        .section.active { display: block; }

        .step-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 22px 4px 10px 4px; 
        }
        .step-label { 
            font-size: 16px; 
            font-weight: 700; 
            color: var(--md-text-main); 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-reset { 
            font-size: 13px; 
            font-weight: 700; 
            color: #b91c1c; 
            background: #fef2f2; 
            border: 1px solid #fecaca; 
            cursor: pointer; 
            padding: 6px 14px; 
            border-radius: var(--radius-pill);
            transition: all 0.15s ease;
        }

        .slider-container { 
            display: flex; 
            overflow-x: auto; 
            gap: 12px; 
            padding: 4px 2px 14px 2px; 
            scrollbar-width: none; 
            scroll-snap-type: x mandatory; 
        }
        .slider-container::-webkit-scrollbar { display: none; }
        .slider-card { 
            flex: 0 0 160px; 
            aspect-ratio: 4 / 5; 
            border-radius: var(--radius-card); 
            overflow: hidden; 
            cursor: pointer; 
            background: var(--md-surface-high); 
            position: relative; 
            border: 2px solid transparent; 
            transition: all 0.2s ease; 
            scroll-snap-align: start; 
            box-shadow: var(--elevation-1);
        }
        .slider-card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            position: absolute; 
            top: 0; 
            left: 0; 
            background: var(--md-surface-low);
        }
        .slider-card .card-mask { 
            background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0) 100%); 
            width: 100%; 
            padding: 12px 10px; 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            z-index: 2; 
            text-align: center; 
        }
        .slider-card .card-text { 
            color: #ffffff; 
            font-size: 14px; 
            font-weight: 700; 
            display: block; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .slider-card.active { 
            border-color: var(--md-primary); 
            box-shadow: 0 0 0 2px var(--md-primary-container);
        }

        .badge-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
        .custom-badge { 
            padding: 10px 18px; 
            border-radius: var(--radius-pill); 
            font-size: 14px; 
            font-weight: 600; 
            cursor: pointer; 
            background: var(--md-surface); 
            color: var(--md-text-sub); 
            border: 1px solid var(--md-outline); 
            transition: all 0.15s ease; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
        }
        .custom-badge.active { 
            background: var(--md-primary-container); 
            color: var(--md-on-primary-container); 
            border-color: var(--md-primary); 
            font-weight: 800;
        }

        .select-wrapper { position: relative; margin-bottom: 8px; }
        .md-select {
            width: 100%;
            padding: 14px 44px 14px 16px;
            font-size: 15px;
            font-weight: 600;
            color: var(--md-text-main);
            background: var(--md-surface);
            border: 1px solid var(--md-outline);
            border-radius: var(--radius-sm);
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            box-shadow: var(--elevation-1);
            font-family: inherit;
        }
        .select-arrow {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--md-text-sub);
        }

        .accordion-item { 
            background: var(--md-surface); 
            border-radius: var(--radius-card); 
            border: 1px solid var(--md-outline-variant); 
            margin-bottom: 12px; 
            overflow: hidden; 
            box-shadow: var(--elevation-1);
        }
        .accordion-header { 
            padding: 16px 20px; 
            font-size: 15px; 
            font-weight: 700; 
            color: var(--md-text-main); 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .accordion-content { display: none; padding: 0 16px 16px 16px; }
        .accordion-item.open .accordion-content { display: block; }
        .accordion-item.open .accordion-header { color: var(--md-primary); }
        
        textarea { 
            width: 100%; 
            height: 130px; 
            border: 1px solid var(--md-outline); 
            border-radius: var(--radius-sm); 
            padding: 12px; 
            font-size: 14px; 
            background: var(--md-surface-low); 
            resize: none; 
            color: var(--md-text-main); 
            font-family: inherit; 
            line-height: 1.5;
        }
        
        .btn-m3 { 
            background: var(--md-surface); 
            color: var(--md-primary); 
            border: 1px solid var(--md-outline); 
            padding: 14px; 
            border-radius: var(--radius-pill); 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            min-height: 48px;
        }
        .btn-danger { color: #dc2626; border-color: #fca5a5; background: #fef2f2; width: 100%; margin-top: 14px; }

        .footer-preview { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: var(--md-surface); 
            padding: 16px 16px calc(16px + env(safe-area-inset-bottom)) 16px; 
            box-shadow: var(--elevation-2); 
            z-index: 1000; 
            border-radius: 28px 28px 0 0; 
            max-width: 600px; 
            margin: 0 auto; 
            border-top: 1px solid var(--md-outline-variant); 
        }
        .output-text { 
            color: var(--md-text-main); 
            font-size: 14px; 
            font-weight: 500; 
            max-height: 90px; 
            overflow-y: auto; 
            margin-bottom: 12px; 
            white-space: pre-wrap; 
            line-height: 1.5; 
            background: var(--md-surface-low); 
            padding: 12px 16px; 
            border-radius: var(--radius-card); 
            border: 1px solid var(--md-outline-variant);
        }
        .btn-copy-master { 
            width: 100%; 
            padding: 16px; 
            background: var(--md-primary); 
            color: #ffffff; 
            border: none; 
            border-radius: var(--radius-pill); 
            font-size: 16px; 
            font-weight: 700; 
            cursor: pointer; 
            min-height: 52px;
            box-shadow: var(--elevation-1);
        }

        .toast-box { 
            position: fixed; 
            bottom: 200px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #2f3033; 
            color: #f1f0f4; 
            padding: 10px 22px; 
            border-radius: var(--radius-pill); 
            font-size: 14px; 
            font-weight: 600; 
            opacity: 0; 
            transition: opacity 0.2s, transform 0.2s; 
            pointer-events: none; 
            z-index: 9999; 
            box-shadow: var(--elevation-2);
        }
        .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
    </style>
</head>
<body>

<div class="toast-box" id="toast-wrapper"></div>

<div class="app-header">
    <div class="tabs">
        <div class="tab active" onclick="switchTab(0)">提示詞生成</div>
        <div class="tab" onclick="switchTab(1)">數據配置</div>
    </div>
</div>

<div class="container">
    <div id="section-gen" class="section active">
        <!-- 1. 衣服款式 -->
        <div class="step-header">
            <span class="step-label">
                <span class="material-symbols-outlined">checkroom</span> 衣服款式
            </span>
        </div>
        <div class="slider-container" id="dress-slider-container"></div>

        <!-- 2. 附加特徵 -->
        <div class="step-header">
            <span class="step-label">
                <span class="material-symbols-outlined">auto_awesome</span> 附加特徵
            </span>
            <button class="btn-reset" onclick="clearFeatures()">重置</button>
        </div>
        <div class="badge-grid" id="features-badges-area"></div>

        <!-- 3. 動作姿態 -->
        <div class="step-header">
            <span class="step-label">
                <span class="material-symbols-outlined">accessibility_new</span> 動作姿態
            </span>
        </div>
        <div class="badge-grid" id="action-badges-area"></div>
        
        <!-- 4. 環境場景 -->
        <div class="step-header">
            <span class="step-label">
                <span class="material-symbols-outlined">beach_access</span> 環境場景
            </span>
        </div>
        <div class="select-wrapper">
            <select class="md-select" id="scene-select" onchange="onSceneChange(this.value)"></select>
            <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>
        
        <!-- 5. 鏡頭視角 -->
        <div class="step-header">
            <span class="step-label">
                <span class="material-symbols-outlined">photo_camera</span> 鏡頭視角
            </span>
        </div>
        <div class="badge-grid" id="dist-badges-area"></div>
    </div>

    <div id="section-cfg" class="section">
        <div id="accordion-container"></div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;">
            <button class="btn-m3" onclick="exportConfig()">匯出 JSON</button>
            <button class="btn-m3" onclick="importConfig()">導入 JSON</button>
        </div>
        <button class="btn-m3 btn-danger" onclick="resetConfig()">恢復系統預設</button>
        <input type="file" id="fileInput" style="display:none" onchange="handleFile(this)">
    </div>
</div>

<div class="footer-preview">
    <div class="output-text" id="final-output"></div>
    <button class="btn-copy-master" onclick="copyPrompt()">複製提示詞</button>
</div>

<script>
    let selectedExtraFeatures = [], selectedSceneName = '', selectedDressLine = '', selectedDistLine = '', selectedActionObj = null;

    // 質感 Material Design SVG 卡片 (當無輸入網址時的優雅預設)
    const FALLBACK_SVG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="%23d3e3fd"/><stop offset="100%" stop-color="%23a8c7fa"/></linearGradient></defs><rect width="300" height="400" fill="url(%23g)"/><path d="M150 130 C135 110, 165 110, 150 130 L115 170 L135 290 L165 290 L185 170 Z" fill="%230b57d0" opacity="0.35"/><circle cx="150" cy="110" r="12" fill="%230b57d0" opacity="0.35"/></svg>';

    const items = [
        { id: 'template', label: '1. 生成範本結構', default: `★ 高效分段核心流\n上傳的照片人物為原型。\n人物特徵：{特徵}\n衣服：{衣服}\n動作：{動作}\n角度：{鏡頭}\n場景：{場景}\n品質：超寫實 8K，細節拉滿，比例 9:16` },
        { id: 'baseFeatures', label: '2. 人物基礎特徵', default: '小頭、皮膚白皙、極致垂墜的上圍、豐滿曲線、修長腿部' },
        { id: 'dress', label: '3. 衣服款式 (格式：圖片網址|名稱 或 直接輸入名稱)', default: `https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400&q=80|侍女裙\nhttps://images.unsplash.com/photo-1612336307429-8a898d10e223?w=400&q=80|淺藍雪紡裙\nhttps://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400&q=80|白T搭窄裙\nhttps://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400&q=80|高領針織衫\nhttps://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=400&q=80|碎花連身裙\nhttps://images.unsplash.com/photo-1594938298603-c8148c4dae35?w=400&q=80|西裝套裝` },
        { id: 'action', label: '4. 通用動作池 (名稱 # 詳細描寫)', default: `韓系純欲 # 雙膝微曲並攏跪坐在柔和的地毯上，身體微微前傾\n慵懶微醺 # 半靠在沙發扶手上，一隻手漫不經心輕拉衣領\n絲襪性感 # 輕撫黑絲邊緣，修長雙腿微微交疊\n溫柔側躺 # 側躺在淺色沙發上，頭微微垂下，眼睛向上望鏡頭\n自信托腮 # 獨自坐在桌前，單手托腮神情自信直視鏡頭` },
        { id: 'scene', label: '5. 環境場景', default: '白色房間\n辦公室\n海灘沙灘\n奢華酒店' },
        { id: 'dist', label: '6. 鏡頭視角', default: '中景\n近景\n俯視近景\n俯視全身' },
        { id: 'features', label: '7. 附加特徵', default: '法式瀏海\n腮紅\n銀色耳環\n細框眼鏡' }
    ];

    function toast(msg) {
        const box = document.getElementById('toast-wrapper');
        box.innerText = msg; box.classList.add('show');
        setTimeout(() => box.classList.remove('show'), 1600);
    }

    function init() {
        const accordionContainer = document.getElementById('accordion-container');
        accordionContainer.innerHTML = ''; 
        items.forEach((item) => {
            const wrap = document.createElement('div');
            wrap.className = 'accordion-item';
            wrap.innerHTML = `
                <div class="accordion-header" onclick="toggleAccordion(this)">${item.label}</div>
                <div class="accordion-content"><textarea id="cfg-${item.id}"></textarea></div>
            `;
            accordionContainer.appendChild(wrap);
            const textarea = document.getElementById(`cfg-${item.id}`);
            textarea.value = localStorage.getItem(`cfg-${item.id}`) || item.default;
            textarea.addEventListener('input', () => {
                localStorage.setItem(`cfg-${item.id}`, textarea.value);
                syncDataFromConfig();
            });
        });
        syncDataFromConfig();
    }

    function toggleAccordion(header) {
        const item = header.parentElement;
        const isOpen = item.classList.contains('open');
        document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('open'));
        if (!isOpen) item.classList.add('open');
    }

    function syncDataFromConfig() {
        renderClothesSlider();
        renderFeaturesBadges();
        renderActionBadges();
        renderSceneDropdown();
        renderDistBadges();
        updateResult();
    }

    function clearFeatures() {
        selectedExtraFeatures = [];
        document.querySelectorAll('#features-badges-area .custom-badge').forEach(el => el.classList.remove('active'));
        updateResult();
    }

    function renderClothesSlider() {
        const container = document.getElementById('dress-slider-container'); container.innerHTML = '';
        const lines = document.getElementById('cfg-dress').value.split('\n').filter(l=>l.trim());
        if(!selectedDressLine || !lines.includes(selectedDressLine)) selectedDressLine = lines[0] || '';
        
        lines.forEach((line) => {
            const data = parseLineData(line);
            const card = document.createElement('div');
            card.className = 'slider-card' + (line === selectedDressLine ? ' active' : '');
            
            const imgSrc = data.img ? data.img : FALLBACK_SVG;

            card.innerHTML = `
                <img src="${imgSrc}" alt="${data.text}" onerror="this.onerror=null; this.src='${FALLBACK_SVG}';" loading="lazy">
                <div class="card-mask">
                    <span class="card-text">${data.text}</span>
                </div>
            `;
            
            card.onclick = () => {
                selectedDressLine = line;
                document.querySelectorAll('#dress-slider-container .slider-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active'); 
                updateResult();
            };
            container.appendChild(card);
        });
    }

    function renderFeaturesBadges() {
        const pool = document.getElementById('cfg-features').value.split('\n').filter(l=>l.trim());
        const area = document.getElementById('features-badges-area'); area.innerHTML = '';
        selectedExtraFeatures = selectedExtraFeatures.filter(f => pool.includes(f));
        pool.forEach(feat => {
            const b = document.createElement('div');
            b.className = 'custom-badge' + (selectedExtraFeatures.includes(feat) ? ' active' : '');
            b.innerText = feat;
            b.onclick = () => {
                b.classList.toggle('active');
                selectedExtraFeatures = b.classList.contains('active') ? [...selectedExtraFeatures, feat] : selectedExtraFeatures.filter(f=>f!==feat);
                updateResult();
            };
            area.appendChild(b);
        });
    }

    function renderActionBadges() {
        const pool = document.getElementById('cfg-action').value.split('\n').filter(l=>l.trim());
        const area = document.getElementById('action-badges-area'); area.innerHTML = '';
        const actionsParsed = pool.map(line => {
            const parts = line.split('#');
            return { name: parts[0].trim(), detail: parts[1] ? parts[1].trim() : parts[0].trim() };
        });
        if(!selectedActionObj || !actionsParsed.some(a => a.name === selectedActionObj.name)) {
            selectedActionObj = actionsParsed[0] || { name: '', detail: '' };
        }
        actionsParsed.forEach(act => {
            const b = document.createElement('div');
            b.className = 'custom-badge' + (act.name === selectedActionObj.name ? ' active' : '');
            b.innerText = act.name;
            b.onclick = () => {
                document.querySelectorAll('#action-badges-area .custom-badge').forEach(el=>el.classList.remove('active'));
                b.classList.add('active'); selectedActionObj = act; updateResult();
            };
            area.appendChild(b);
        });
    }

    function renderSceneDropdown() {
        const pool = document.getElementById('cfg-scene').value.split('\n').filter(l=>l.trim());
        const select = document.getElementById('scene-select');
        select.innerHTML = '';
        if(!selectedSceneName || !pool.includes(selectedSceneName)) selectedSceneName = pool[0] || '';
        
        pool.forEach(sc => {
            const opt = document.createElement('option');
            opt.value = sc;
            opt.textContent = sc;
            if(sc === selectedSceneName) opt.selected = true;
            select.appendChild(opt);
        });
    }

    function onSceneChange(val) {
        selectedSceneName = val;
        updateResult();
    }

    function renderDistBadges() {
        const pool = document.getElementById('cfg-dist').value.split('\n').filter(l=>l.trim());
        const area = document.getElementById('dist-badges-area'); area.innerHTML = '';
        if(!selectedDistLine || !pool.includes(selectedDistLine)) selectedDistLine = pool[0] || '';
        pool.forEach(dist => {
            const b = document.createElement('div');
            b.className = 'custom-badge' + (dist === selectedDistLine ? ' active' : '');
            b.innerText = dist;
            b.onclick = () => {
                document.querySelectorAll('#dist-badges-area .custom-badge').forEach(el=>el.classList.remove('active'));
                b.classList.add('active'); selectedDistLine = dist; updateResult();
            };
            area.appendChild(b);
        });
    }

    function updateResult() {
        const baseFeat = document.getElementById('cfg-baseFeatures').value.trim();
        const fullFeatures = baseFeat + (selectedExtraFeatures.length > 0 ? "、" + selectedExtraFeatures.join('、') : "");
        const templateStr = document.getElementById('cfg-template').value;
        const actionText = selectedActionObj ? selectedActionObj.detail : '';

        const output = templateStr
            .replace(/{特徵}/g, fullFeatures)
            .replace(/{衣服}/g, parseLineData(selectedDressLine).text)
            .replace(/{動作}/g, actionText)
            .replace(/{鏡頭}/g, parseLineData(selectedDistLine).text)
            .replace(/{場景}/g, selectedSceneName);

        document.getElementById('final-output').innerText = output;
    }

    function parseLineData(line) {
        if (!line) return { img: '', text: '' };
        const cleanLine = line.trim();
        if (cleanLine.includes('|')) { 
            const parts = cleanLine.split('|'); 
            return { img: parts[0].trim(), text: parts[1].trim() }; 
        }
        return { img: '', text: cleanLine };
    }

    function resetConfig() { 
        if(confirm('確定要還原系統預設？')) { 
            items.forEach(item => localStorage.removeItem(`cfg-${item.id}`)); 
            init(); toast('已還原預設'); 
        } 
    }

    function exportConfig() {
        const data = {}; items.forEach(item => data[item.id] = document.getElementById(`cfg-${item.id}`).value);
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
        a.download = `prompt_m3_fashion_manual.json`; a.click(); toast('JSON 已匯出');
    }

    function importConfig() { document.getElementById('fileInput').click(); }
    
    function handleFile(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            const data = JSON.parse(e.result);
            items.forEach(item => { if(data[item.id]) { document.getElementById(`cfg-${item.id}`).value = data[item.id]; localStorage.setItem(`cfg-${item.id}`, data[item.id]); } });
            syncDataFromConfig(); toast('配置已導入');
        };
        reader.readAsText(input.files[0]);
    }

    function switchTab(idx) {
        document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
        document.getElementById('section-gen').classList.toggle('active', idx === 0);
        document.getElementById('section-cfg').classList.toggle('active', idx === 1);
        if(idx === 0) syncDataFromConfig();
    }

    function copyPrompt() {
        navigator.clipboard.writeText(document.getElementById('final-output').innerText).then(() => toast('已複製提示詞！'));
    }

    init();
</script>
</body>
</html>
